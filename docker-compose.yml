services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sqlglot-root
      MYSQL_DATABASE: sql_dialect_converter
      MYSQL_USER: sqlglot
      MYSQL_PASSWORD: sqlglot
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      AUDIT_DB_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: sql_dialect_converter
      MYSQL_USER: sqlglot
      MYSQL_PASSWORD: sqlglot
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
