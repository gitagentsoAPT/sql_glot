apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-dialect-converter
  labels:
    app: sql-dialect-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-dialect-converter
  template:
    metadata:
      labels:
        app: sql-dialect-converter
    spec:
      containers:
        - name: sql-dialect-converter
          image: sql-dialect-converter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: AUDIT_DB_ENABLED
              value: "true"
            - name: MYSQL_HOST
              value: sql-dialect-mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: sql-dialect-mysql
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: sql-dialect-mysql
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-dialect-mysql
                  key: MYSQL_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sql-dialect-converter
  labels:
    app: sql-dialect-converter
spec:
  type: NodePort
  selector:
    app: sql-dialect-converter
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Secret
metadata:
  name: sql-dialect-mysql
type: Opaque
stringData:
  MYSQL_DATABASE: sql_dialect_converter
  MYSQL_USER: sqlglot
  MYSQL_PASSWORD: sqlglot
  MYSQL_ROOT_PASSWORD: sqlglot-root
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sql-dialect-mysql-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-dialect-mysql
  labels:
    app: sql-dialect-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-dialect-mysql
  template:
    metadata:
      labels:
        app: sql-dialect-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: sql-dialect-mysql
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-schema
              mountPath: /docker-entrypoint-initdb.d/01-schema.sql
              subPath: schema.sql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: sql-dialect-mysql-data
        - name: mysql-schema
          configMap:
            name: sql-dialect-schema
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sql-dialect-schema
data:
  schema.sql: |
    CREATE DATABASE IF NOT EXISTS sql_dialect_converter;
    USE sql_dialect_converter;
    CREATE TABLE IF NOT EXISTS dialect (
      dialect_id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
      dialect_name VARCHAR(64) NOT NULL,
      version VARCHAR(32) NULL,
      supported_options JSON NOT NULL,
      PRIMARY KEY (dialect_id),
      UNIQUE KEY uq_dialect_name (dialect_name)
    ) ENGINE = InnoDB;
    CREATE TABLE IF NOT EXISTS ast_snapshot (
      snapshot_id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
      request_id CHAR(36) NOT NULL,
      source_dialect_id BIGINT UNSIGNED NOT NULL,
      target_dialect_id BIGINT UNSIGNED NOT NULL,
      snapshot_stage VARCHAR(32) NOT NULL,
      stage_number INT UNSIGNED NOT NULL,
      raw_sql LONGTEXT NOT NULL,
      generated_sql LONGTEXT NULL,
      ast_json JSON NOT NULL,
      node_count INT UNSIGNED NOT NULL,
      created_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
      PRIMARY KEY (snapshot_id),
      UNIQUE KEY uq_snapshot_request_stage (request_id, stage_number),
      KEY ix_snapshot_request (request_id),
      FOREIGN KEY (source_dialect_id) REFERENCES dialect (dialect_id),
      FOREIGN KEY (target_dialect_id) REFERENCES dialect (dialect_id)
    ) ENGINE = InnoDB;
    CREATE TABLE IF NOT EXISTS optimization_rule (
      rule_id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
      rule_name VARCHAR(128) NOT NULL,
      pass_number INT UNSIGNED NOT NULL,
      description TEXT NOT NULL,
      is_active BOOLEAN NOT NULL DEFAULT TRUE,
      PRIMARY KEY (rule_id),
      UNIQUE KEY uq_optimization_rule_name (rule_name)
    ) ENGINE = InnoDB;
    CREATE TABLE IF NOT EXISTS transformation (
      snapshot_id BIGINT UNSIGNED NOT NULL,
      step_number INT UNSIGNED NOT NULL,
      rule_id BIGINT UNSIGNED NOT NULL,
      output_snapshot_id BIGINT UNSIGNED NOT NULL,
      ast_delta JSON NOT NULL,
      exec_time_us BIGINT UNSIGNED NOT NULL,
      PRIMARY KEY (snapshot_id, step_number),
      FOREIGN KEY (snapshot_id) REFERENCES ast_snapshot (snapshot_id),
      FOREIGN KEY (output_snapshot_id) REFERENCES ast_snapshot (snapshot_id),
      FOREIGN KEY (rule_id) REFERENCES optimization_rule (rule_id)
    ) ENGINE = InnoDB;
---
apiVersion: v1
kind: Service
metadata:
  name: sql-dialect-mysql
spec:
  selector:
    app: sql-dialect-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
