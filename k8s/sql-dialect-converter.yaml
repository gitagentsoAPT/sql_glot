apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-dialect-converter
  labels:
    app: sql-dialect-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-dialect-converter
  template:
    metadata:
      labels:
        app: sql-dialect-converter
    spec:
      containers:
        - name: sql-dialect-converter
          image: sql-dialect-converter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sql-dialect-converter
  labels:
    app: sql-dialect-converter
spec:
  type: NodePort
  selector:
    app: sql-dialect-converter
  ports:
    - name: http
      port: 80
      targetPort: http
